[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curagent"
version = "0.1.0"
description = "A small, general recursive agent with a persistent Python REPL"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
browsecomp = ["fastmcp>=2.9,<4", "pyarrow>=14"]
deepdive = ["datasets>=2.19", "tavily-python>=0.7.23"]
gemini = ["google-genai>=1.0"]
oolong = ["datasets>=2.19"]
all-providers = [
    "anthropic>=0.40",
    "fastmcp>=2.9,<4",
    "google-genai>=1.0",
    "datasets>=2.19",
    "pyarrow>=14",
    "tavily-python>=0.7.23",
]

[tool.setuptools.packages.find]
include = ["recursive_agent*"]
